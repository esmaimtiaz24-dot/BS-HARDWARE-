<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — BS Hardware And Sanitary</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-body">

  <div class="admin-login-shell">
    <div class="admin-login-card">

      <div class="d-flex align-items-center gap-3">
        <span class="brand-mark"><svg class="brand-glyph" viewBox="0 0 72 72" width="40" height="40" role="img" aria-label="BS Hardware And Sanitary logo"><rect x="1" y="1" width="70" height="70" rx="13" fill="#a3130b"/><rect x="5.5" y="5.5" width="61" height="61" rx="9" fill="none" stroke="#e8d3a3" stroke-width="1" opacity=".9"/><rect x="9" y="9" width="54" height="54" rx="6" fill="none" stroke="#f7f3ec" stroke-width=".5" opacity=".28"/><text x="36" y="47" text-anchor="middle" class="bm-letters" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="29" letter-spacing="-1.2" fill="#fdfbf6">BS</text><rect x="30" y="53.5" width="12" height="2" fill="#e8d3a3"/></svg></span>
        <div>
          <strong style="font-family:var(--font-serif);font-size:1.12rem;letter-spacing:-.01em">BS Hardware</strong>
          <div style="font-size:.54rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)">And Sanitary</div>
        </div>
      </div>

      <h1>Admin login</h1>
      <p>Log in to manage inventory and orders.</p>

      <form id="loginForm" novalidate>
        <div id="emailWrap" class="mb-3 hidden">
          <label class="form-label-bs" for="adminEmail">Admin email</label>
          <input class="input-bs" id="adminEmail" type="email" autocomplete="username" placeholder="admin@bshardware.pk">
        </div>

        <label class="form-label-bs" for="adminPass">Password</label>
        <div class="pw-wrap mb-1">
          <input class="input-bs" id="adminPass" type="password" autocomplete="current-password" placeholder="••••••••" style="padding-right:44px">
          <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="err-msg" id="loginErr">That password is incorrect. Please try again.</div>

        <button class="btn-bs-red btn-bs w-100 mt-3" type="submit" id="loginBtn">
          Login to dashboard
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="d-flex justify-content-between align-items-center mt-4" style="font-size:.76rem">
        <a href="index.html">← Back to store</a>
        <a href="track.html">Track order</a>
      </div>

    </div>
  </div>

  <script src="assets/vendor/jquery.min.js"></script>
  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin-login.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
